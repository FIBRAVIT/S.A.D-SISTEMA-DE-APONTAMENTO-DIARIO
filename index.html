<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
<meta content="no-cache" http-equiv="Pragma"/>
<meta content="0" http-equiv="Expires"/>
<title>S.P.A.D.O — Sistema de Planejamento e Apontamento Diário Operacional</title>
<meta content="#10243A" name="theme-color"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#F0F4F8;color:#2C2C2C}

/* ═══ LOGIN - PADRÃO FIBRAVIT ═══ */
#loginPage {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0f2238 0%, #1a3a5c 60%, #2563a8 100%);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

#loadBar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#10243B,#4da3ff,#10243B);background-size:200%;animation:lb 1.2s linear infinite;z-index:9999;transition:opacity .3s;opacity:0;width:100%}
@keyframes lb{0%{background-position:0%}100%{background-position:200%}}

.toast{position:fixed;bottom:48px;right:22px;background:#10243B;color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;display:flex;align-items:center;gap:9px;max-width:340px}
.toast.show{transform:translateY(0);opacity:1}.toast.ok{background:#166534}.toast.err{background:#991b1b}

@media(max-width:768px){
  #loginPage .lp-left{display:none}
  #loginPage .lp-right{width:100%!important;padding:40px 22px!important}
}
</style>
</head>
<body>
<div id="loadBar"></div>
<div class="toast" id="toast"></div>
<div id="loginPage">
<div style="display:flex;width:100%;max-width:900px;min-height:500px;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.4)">
<!-- LADO ESQUERDO -->
<div class="lp-left" style="flex:1;background:linear-gradient(135deg,#164060 0%,#1e5080 40%,#296aa5 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;position:relative;overflow:hidden">
<!-- Hexágono decorativo fundo -->
<svg style="position:absolute;opacity:0.08;width:340px;height:340px" viewbox="0 0 200 200">
<polygon fill="none" points="100,10 172,52 172,138 100,180 28,138 28,52" stroke="#ffffff" stroke-width="3"></polygon>
<polygon fill="none" points="100,28 158,62 158,128 100,162 42,128 42,62" stroke="#ffffff" stroke-width="1.5"></polygon>
</svg>
<!-- Logo SVG inline -->
<svg style="width:240px;height:240px;position:relative;z-index:1" viewbox="0 0 200 200">
<!-- Hexágono externo -->
<polygon fill="none" opacity="0.3" points="100,14 172,55 172,137 100,178 28,137 28,55" stroke="#ffffff" stroke-width="1.5"></polygon>
<!-- Hexágono interno -->
<polygon fill="none" opacity="0.12" points="100,28 158,62 158,130 100,164 42,130 42,62" stroke="#ffffff" stroke-width="1"></polygon>
<!-- Sigla S.P.A.D.O — fonte menor para caber no hexágono -->
<text fill="#ffffff" font-family="Arial Black,sans-serif" font-size="30" font-weight="900" letter-spacing="1" text-anchor="middle" x="100" y="105">S.P.A.D.O</text>
<!-- Linha decorativa esquerda -->
<line opacity="0.4" stroke="#ffffff" stroke-width="1" x1="30" x2="82" y1="118" y2="118"></line>
<!-- Diamante central -->
<polygon fill="#ffffff" opacity="0.6" points="100,113 107,118 100,123 93,118"></polygon>
<!-- Linha decorativa direita -->
<line opacity="0.4" stroke="#ffffff" stroke-width="1" x1="118" x2="170" y1="118" y2="118"></line>
<!-- GRUPO -->
<text fill="#ffffff" font-family="Arial,sans-serif" font-size="10" font-weight="500" letter-spacing="4" opacity="0.75" text-anchor="middle" x="100" y="140">GRUPO</text>
<!-- FIBRAVIT -->
<text fill="#ffffff" font-family="Arial Black,sans-serif" font-size="14" font-weight="900" letter-spacing="3" opacity="0.9" text-anchor="middle" x="100" y="157">FIBRAVIT</text>
</svg>
<!-- Nome do sistema -->
<div style="text-align:center;margin-top:20px;position:relative;z-index:1">
<div style="font-size:12px;font-weight:700;color:#ffffff;letter-spacing:1px;line-height:1.6;opacity:0.9">SISTEMA DE PLANEJAMENTO E APONTAMENTO DIÁRIO OPERACIONAL</div>
<div style="font-size:11px;font-weight:600;color:#f0c040;letter-spacing:1.5px;opacity:0.95;margin-top:4px">GRUPO FIBRAVIT</div>
</div>
<!-- Rodapé discreto -->
<div style="position:absolute;bottom:16px;text-align:center;font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:0.5px">
        Desenvolvido por Everest Consultoria em Gestão Empresarial
      </div>
</div>
<!-- LADO DIREITO - FORMULÁRIO -->
<div class="lp-right" style="flex:1;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 40px">
<div style="width:100%;max-width:320px">
<div style="margin-bottom:32px">
<div style="font-size:24px;font-weight:800;color:#1e5080;margin-bottom:6px">Bem-vindo!</div>
<div style="font-size:14px;color:#64748b">Faça login para acessar o sistema</div>
</div>
<div id="loginErr" style="display:none;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;font-size:13px;color:#991b1b;margin-bottom:14px;text-align:center">
          ❌ Usuário ou senha incorretos
        </div>
<div style="margin-bottom:18px">
<label style="display:block;font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Usuário</label>
<input autocomplete="off" id="lu" onblur="this.style.borderColor='#e2e8f0'" onfocus="this.style.borderColor='#296aa5'" placeholder="Digite seu usuário" style="width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;transition:border .2s;font-family:inherit" type="text"/>
</div>
<div style="margin-bottom:24px">
<label style="display:block;font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Senha</label>
<input autocomplete="off" id="lp" onblur="this.style.borderColor='#e2e8f0'" onfocus="this.style.borderColor='#296aa5'" onkeydown="if(event.key==='Enter'){event.preventDefault();doLogin();}" placeholder="Digite sua senha" style="width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;transition:border .2s;font-family:inherit" type="password"/>
</div>
<button onclick="doLogin()" onmouseout="this.style.opacity='1'" onmouseover="this.style.opacity='.9'" style="width:100%;padding:13px;background:linear-gradient(135deg,#1e5080,#296aa5);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;font-family:inherit" type="button">
          🔐 Entrar
        </button>
<!-- ACESSOS DEMO -->
<div style="margin-top:24px;padding-top:20px;border-top:1px solid #e2e8f0">
<div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;text-align:center;margin-bottom:10px">Acessos de demonstração</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
<button onclick="demoLogin('admin','admin123')" onmouseout="this.style.borderColor='#e2e8f0'" onmouseover="this.style.borderColor='#10243B'" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;background:#F0F4F8;border:1.5px solid #e2e8f0;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .2s">
<span style="font-size:18px">👑</span>
<span style="font-size:10px;font-weight:700;color:#10243B">Admin</span>
<span style="font-size:9px;color:#64748b">admin</span>
</button>
<button onclick="demoLogin('coord','coord123')" onmouseout="this.style.borderColor='#e2e8f0'" onmouseover="this.style.borderColor='#10243B'" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;background:#F0F4F8;border:1.5px solid #e2e8f0;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .2s">
<span style="font-size:18px">👔</span>
<span style="font-size:10px;font-weight:700;color:#10243B">Coordenador</span>
<span style="font-size:9px;color:#64748b">coord</span>
</button>
<button onclick="demoLogin('super','super123')" onmouseout="this.style.borderColor='#e2e8f0'" onmouseover="this.style.borderColor='#10243B'" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;background:#F0F4F8;border:1.5px solid #e2e8f0;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .2s">
<span style="font-size:18px">👷</span>
<span style="font-size:10px;font-weight:700;color:#10243B">Supervisor</span>
<span style="font-size:9px;color:#64748b">super</span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>
<script>
// AUTH
var Auth = {
  KEY: 'spado_user',
  save: function(u) { localStorage.setItem(this.KEY, JSON.stringify(u)); },
  load: function() { var s = localStorage.getItem(this.KEY); return s ? JSON.parse(s) : null; },
  logout: function() { localStorage.removeItem(this.KEY); window.location.href = 'index.html'; }
};

// API
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzdKhQ4ZxvXYQUjhXG9l3SSHrPZVToG-9o0XXSLdg8aDQ3evNoOs9e7frTab66Y95LR/exec';
var API = {
  login: async function(u, s) {
    var qs = new URLSearchParams({ action: 'login', usuario: u, senha: s });
    var res = await fetch(SCRIPT_URL + '?' + qs);
    var json = await res.json();
    if (!json.success) throw new Error(json.message || 'Erro');
    return json;
  }
};

function showLoad(on){document.getElementById('loadBar').style.opacity=on?1:0}
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(type||'');
  setTimeout(()=>t.className='toast',3000);
}

async function doLogin(){
  const u=document.getElementById('lu').value.trim();
  const p=document.getElementById('lp').value;
  const err=document.getElementById('loginErr');
  if(!u||!p){err.style.display='block';err.textContent='❌ Preencha usuário e senha';return;}
  err.style.display='none';
  showLoad(true);
  try{
    const res=await API.login(u,p);
    Auth.save(res.user);
    window.location.href='dashboard.html';
  }catch(e){
    // Demo login
    const demos={
      'admin':{senha:'admin123',perfil:'admin',nome:'Administrador'},
      'coord':{senha:'coord123',perfil:'coordenador',nome:'Coordenador'},
      'super':{senha:'super123',perfil:'supervisor',nome:'Supervisor'}
    };
    const demo=demos[u];
    if(demo&&demo.senha===p){
      Auth.save({id:'1',nome:demo.nome,usuario:u,perfil:demo.perfil});
      window.location.href='dashboard.html';
    }else{
      showLoad(false);
      err.style.display='block';
      err.textContent='❌ Usuário ou senha incorretos';
    }
  }
}

function demoLogin(u,s){
  document.getElementById('lu').value=u;
  document.getElementById('lp').value=s;
  doLogin();
}

document.getElementById('lu').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
