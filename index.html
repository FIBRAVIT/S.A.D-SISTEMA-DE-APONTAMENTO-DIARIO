<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>S.AD – Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/>
</head>
<body class="login-page">
<div class="login-card">
<div class="login-logo">
<div class="logo-icon">📋</div>
<h1>S.A.D</h1>
<p>S.A.D – Sistema de Apontamento Diário</p>
</div>
<div class="alert alert-danger" id="alert-login"></div>
<form id="form-login">
<div class="form-group">
<label>Usuário</label>
<input autocomplete="username" id="login-usuario" placeholder="seu.usuario" required="" type="text"/>
</div>
<div class="form-group">
<label>Senha</label>
<input autocomplete="current-password" id="login-senha" placeholder="••••••••" required="" type="password"/>
</div>
<button class="btn btn-primary" style="margin-top:8px" type="submit">
        🔐 Entrar no Sistema
      </button>
</form>
<div style="margin-top:24px;padding-top:20px;border-top:1px solid #e5e7eb">
<p style="font-size:11px;color:#9ca3af;text-align:center;margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em">Acessos de demonstração</p>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
<button class="btn btn-secondary btn-sm" onclick="demoLogin('admin','admin123')" style="flex-direction:column;gap:2px;padding:10px 6px">
<span>👑</span><span style="font-size:10px">Admin</span>
</button>
<button class="btn btn-secondary btn-sm" onclick="demoLogin('coord','coord123')" style="flex-direction:column;gap:2px;padding:10px 6px">
<span>👔</span><span style="font-size:10px">Coordenador</span>
</button>
<button class="btn btn-secondary btn-sm" onclick="demoLogin('super','super123')" style="flex-direction:column;gap:2px;padding:10px 6px">
<span>👷</span><span style="font-size:10px">Supervisor</span>
</button>
</div>
</div>
<p style="text-align:center;font-size:11px;color:#9ca3af;margin-top:20px">
      S.A.D v1.0  ·  © 2026
    </p>
</div>
<script src="app.js"></script>
<script>
    function demoLogin(u, s) {
      document.getElementById('login-usuario').value = u;
      document.getElementById('login-senha').value = s;
      document.getElementById('form-login').dispatchEvent(new Event('submit'));
    }
  </script>
</body>
</html>
