<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
<title>S.A.D – Sistema de Apontamento Diário</title>
<meta content="#10243A" name="theme-color"/>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2238 0%, #1a3a5c 60%, #2563a8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── HEADER DA EMPRESA ── */
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand .brand-icon {
      width: 68px;
      height: 68px;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 14px;
      backdrop-filter: blur(8px);
    }

    .login-brand h1 {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
    }

    .login-brand .brand-sub {
      font-size: 11px;
      color: #f0c040;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── CARD DE LOGIN ── */
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 36px 36px 28px;
      width: 100%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.35);
    }

    .login-card h2 {
      font-size: 15px;
      font-weight: 700;
      color: #10243B;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .fi {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .fi label {
      font-size: 10.5px;
      font-weight: 700;
      color: #10243B;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .fi input {
      padding: 10px 13px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13.5px;
      color: #2C2C2C;
      background: #F0F4F8;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.2s;
      outline: none;
    }

    .fi input:focus {
      border-color: #10243B;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(16,36,59,0.08);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0f2238 0%, #1a3a5c 60%, #2563a8 100%);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Segoe UI', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      letter-spacing: 0.3px;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16,36,59,0.35);
    }

    .btn-login:active { transform: translateY(0); }

    /* ── ALERTA ── */
    .alert-login {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      background: #fee2e2;
      color: #991b1b;
      border-left: 4px solid #ef4444;
      margin-bottom: 14px;
      align-items: center;
      gap: 8px;
    }

    /* ── DIVISOR ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 16px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .divider span {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    /* ── BOTÕES DEMO ── */
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn-demo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 10px 6px;
      background: #F0F4F8;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.2s;
    }

    .btn-demo:hover {
      background: #e2e8f0;
      border-color: #10243B;
      transform: translateY(-1px);
    }

    .btn-demo .demo-icon { font-size: 18px; }
    .btn-demo .demo-label { font-size: 10px; font-weight: 700; color: #10243B; }
    .btn-demo .demo-user { font-size: 9px; color: #64748b; font-weight: 600; }

    /* ── RODAPÉ ── */
    .login-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .login-footer span {
      color: #f0c040;
    }

    /* ── LOADING ── */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,34,56,0.75);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(4px);
    }

    .loading-overlay.show { display: flex; }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #f0c040;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-txt {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .login-card { padding: 28px 22px 22px; }
    }
  </style>
</head>
<body>
<!-- LOADING -->
<div class="loading-overlay" id="loading-overlay">
<div class="spinner"></div>
<div class="loading-txt">Autenticando...</div>
</div>
<div class="login-wrap">
<!-- BRAND -->
<div class="login-brand">
<div class="brand-icon">📋</div>
<h1>S.A.D</h1>
<div class="brand-sub">Sistema de Apontamento Diário</div>
</div>
<!-- CARD -->
<div class="login-card">
<h2>🔐 Acesso ao Sistema</h2>
<div class="alert-login" id="alert-login">
        ⚠️ <span id="alert-msg">Usuário ou senha incorretos.</span>
</div>
<form autocomplete="on" id="form-login">
<div class="fi">
<label>Usuário</label>
<input autocomplete="username" id="login-usuario" placeholder="seu.usuario" required="" type="text"/>
</div>
<div class="fi">
<label>Senha</label>
<input autocomplete="current-password" id="login-senha" placeholder="••••••••" required="" type="password"/>
</div>
<button class="btn-login" type="submit">
          🔐 Entrar no Sistema
        </button>
</form>
<div class="divider"><span>Acessos de demonstração</span></div>
<div class="demo-grid">
<button class="btn-demo" onclick="demoLogin('admin','admin123')">
<span class="demo-icon">👑</span>
<span class="demo-label">Admin</span>
<span class="demo-user">admin</span>
</button>
<button class="btn-demo" onclick="demoLogin('coord','coord123')">
<span class="demo-icon">👔</span>
<span class="demo-label">Coordenador</span>
<span class="demo-user">coord</span>
</button>
<button class="btn-demo" onclick="demoLogin('super','super123')">
<span class="demo-icon">👷</span>
<span class="demo-label">Supervisor</span>
<span class="demo-user">super</span>
</button>
</div>
</div>
<!-- FOOTER -->
<div class="login-footer">
      S.A.D v1.0  ·  © 2026  ·  <span>Grupo Fibravit</span>
</div>
</div>
<script src="app.js"></script>
<script>
    function demoLogin(u, s) {
      document.getElementById('login-usuario').value = u;
      document.getElementById('login-senha').value = s;
      document.getElementById('form-login').dispatchEvent(new Event('submit'));
    }

    // Override do showLoading para usar o overlay desta página
    document.getElementById('form-login').addEventListener('submit', function() {
      document.getElementById('loading-overlay').classList.add('show');
    });

    // Override do showAlert para esta página
    const origAlert = Utils?.showAlert;
    window.addEventListener('load', () => {
      const origLogin = document.getElementById('form-login').onsubmit;
    });

    // Esconde loading se der erro
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('form-login');
      const alertEl = document.getElementById('alert-login');
      const alertMsg = document.getElementById('alert-msg');
      const overlay = document.getElementById('loading-overlay');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        e.stopImmediatePropagation();
        alertEl.style.display = 'none';
        overlay.classList.add('show');

        const usuario = document.getElementById('login-usuario').value;
        const senha = document.getElementById('login-senha').value;

        try {
          const res = await API.login(usuario, senha);
          Auth.save(res.user);
          window.location.href = 'dashboard.html';
        } catch (e) {
          // Demo login
          const demos = {
            'admin': { senha: 'admin123', perfil: 'admin', nome: 'Administrador' },
            'coord': { senha: 'coord123', perfil: 'coordenador', nome: 'Coordenador' },
            'super': { senha: 'super123', perfil: 'supervisor', nome: 'Supervisor' }
          };
          const demo = demos[usuario];
          if (demo && demo.senha === senha) {
            Auth.save({ id: '1', nome: demo.nome, usuario, perfil: demo.perfil });
            window.location.href = 'dashboard.html';
          } else {
            overlay.classList.remove('show');
            alertMsg.textContent = 'Usuário ou senha incorretos.';
            alertEl.style.display = 'flex';
          }
        }
      });
    });
  </script>
</body>
</html>
